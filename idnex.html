<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHD-Kim Planner</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f7;
}

header{
    background:#1976d2;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    font-size:18px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<header>

<h1>📅 PHD-Kim Planner</h1>

<p>개인 일정관리 시스템</p>

</header>

<div class="container">

<div class="card">

<h2>환영합니다.</h2>

<p>
이 홈페이지는 앞으로 일정관리 프로그램으로 발전할 예정입니다.
</p>

<button>
일정관리 (준비중)
</button>

</div>

</div>

</body>
</html>
